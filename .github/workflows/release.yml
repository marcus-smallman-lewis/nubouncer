name: Release to NuGet

# Uses NuGet Trusted Publishing: no API key is stored anywhere.
# GitHub proves this run came from this repo and gets a key that lasts about an hour.
# https://learn.microsoft.com/nuget/nuget-org/trusted-publishing

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test
      - run: dotnet pack src/NuBouncer -c Release -o nupkg
      - name: Log in to NuGet (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
