name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test
      - name: Smoke test against live nuget.org
        run: |
          dotnet run --project src/NuBouncer -- check Newtonsoft.Json
          if dotnet run --project src/NuBouncer -- check Totally.Made.Up.Package.Xyz; then exit 1; fi
